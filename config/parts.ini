; Part names per monster. MHGU stores up to 8 parts per monster with no names, so the overlay shows
; "Part 1".."Part 8" until you name them here. Section = the monster's name as the overlay shows it.
; Tip: hit one part (say the head) and watch which "Part N" flinch bar moves.
; After editing, press "Reload names/parts" in MHGUPie.
;
; [Rathalos]
; Part1 = Head
; Part2 = Body
; Part3 = Left wing
; Part4 = Right wing
; Part5 = Tail
