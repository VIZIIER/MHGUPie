; MHGUPie address map for Monster Hunter Generations Ultimate 1.4.0 (build id FB08F1D20FD1204F)
; running in MHGURecomp (morerokk/MHGURecomp).
;
; Like HunterPie's .map files: every address/offset the overlay reads lives here, so it can be fixed
; without rebuilding the app. All numbers are hex (0x...) or decimal.
;
; Where these came from:
;   [verified]  read straight out of mhgurecomp.exe's own code (its HP scaling, KO tracer, quick-hunt and
;               Discord features read these exact fields of the game's memory).
;   [mhxx]      the MHXX 3DS monster layout (Setsu-BHMT/MHXX-Monster-Info-NTR-Plugin), shifted onto MHGU.
;               The shift was checked on the stun fields (verified) and every shifted offset is used by
;               the recompiled game code, but not seen live yet. Use Tools > Memory Inspector to confirm.

[Process]
; Process names to attach to (comma separated, no .exe)
Names = mhgurecomp, MHGUPieSimulator
; MHGURecomp maps the Switch's 32-bit address space at this fixed host address [verified]:
;   host address = GuestBase + guest address
GuestBase = 0x10000000000
; Guest pointers the game uses are inside this range and 4-byte aligned [verified]
GuestPointerMin = 0x08000000
GuestPointerMax = 0xF0000000

[Monsters]
; u32 global holding the monster manager [verified]
ListPointer = 0x1A51FE0
; the manager's array of monster entity pointers [verified]
FirstSlot = 0x1C
SlotCount = 10
; entity -> pointer to the monster's status block (everything below is relative to that block) [verified]
EntityToStatus = 0x1428
; u16 monster type id; large monsters are below 10000 [verified]
TypeId = 0x1B6
LargeMonsterIdLimit = 10000
; s32 HP and max HP [verified]
Hp = 0x370
MaxHp = 0x374
; how many bytes of the status block to read each tick (must cover every offset in this file)
StatusBlockSize = 0x5F00

[Parts]
; 8 parts, 0xC bytes each. stagger HP / break HP fields verified, counts [mhxx]
Base = 0x3B6
Stride = 0xC
Count = 8
FlinchCount = 0x6
BreakCount = 0x7
FlinchHp = 0x8
BreakHp = 0xA

[Names]
; how the game turns a type id into a line of monsterName_eng.gmd [verified]
; table of 0x88 entries {u32 type id, u32 index}, then u32 message index per index
TypeTable = 0x1797EA4
TypeTableCount = 0x88
TypeTableStride = 8
MessageTable = 0x182E7F8
; text file the names come from, relative to the folder mhgurecomp.exe is in (or an absolute path)
NamesFile = data\romfs\nativeNX\eng\GUI\06_msg\monsterName_eng.gmd

; ---------------------------------------------------------------------------------------------------
; Ailments (status block offsets). Buildup/Threshold are 16-bit, Count is 8-bit, Timer is 32-bit (frames).
; Leave a field out (or set it to 0) if a monster doesn't have it.
; Order here = order on the overlay.

[Ailment.Poison]
Buildup = 0x5C9C
Threshold = 0x5CA8
Count = 0x5D68
Timer = 0x5CAC
Color = #B45AD2
Source = mhxx

[Ailment.Paralysis]
Buildup = 0x5CB6
Threshold = 0x5CB4
Count = 0x5D69
Timer = 0x5CB8
Color = #E8D23C
Source = mhxx

[Ailment.Sleep]
Buildup = 0x5CA0
Threshold = 0x5C9E
Count = 0x5D6A
Color = #5AA0E6
Source = mhxx

[Ailment.Stun]
